name: Release

# Manually triggered (Actions tab or `just release`). The workflow is the only
# place that writes CHANGELOG.md: it generates the changelog with git-cliff,
# bumps plugin.json, commits to main, tags and creates the GitHub release.
#
# Pushes with the deploy key in the RELEASE_DEPLOY_KEY secret. Deploy keys are
# bypass actors in the `protect-main` and `protect-release-tags` rulesets
# (the GitHub Actions app can't be one on personal repositories).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without 'v' (empty = derive from conventional commits)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: jdx/mise-action@v4

      - run: just check

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if [ -z "$version" ]; then
            version="$(git cliff --bumped-version)"
            version="${version#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$version'"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md and plugin.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git cliff --tag "v$VERSION" --output CHANGELOG.md
          jq --arg v "$VERSION" '.version = $v' plugin.json > plugin.json.tmp
          mv plugin.json.tmp plugin.json
          git cliff --tag "v$VERSION" --unreleased --strip header > RELEASE_NOTES.md

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md plugin.json
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main "v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --notes-file RELEASE_NOTES.md --verify-tag
