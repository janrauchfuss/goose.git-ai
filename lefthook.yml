pre-commit:
  parallel: true
  commands:
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}
    shfmt:
      glob: "*.sh"
      run: shfmt -d -i 2 -ci {staged_files}
    json:
      glob: "*.json"
      run: jq empty {staged_files}
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}

commit-msg:
  commands:
    conventional:
      run: |
        head -1 {1} | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+' \
          || { echo "Commit message must follow Conventional Commits (e.g. 'feat: add x')"; exit 1; }

pre-push:
  commands:
    test:
      run: bats tests
